<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-brand" href="{{ '/' | relative_url }}" target="_self" aria-label="{{ site.title }} — Home">YM</a>
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button class="hidden" aria-label="Toggle navigation" aria-expanded="false" aria-controls="more-navigation"><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}" target="_self"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden" id="more-navigation"></ul>
      </nav>
    </div>
  </div>
</div>
